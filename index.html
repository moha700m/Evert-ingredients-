<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>بوت المتجر العربي</title>
  <style>
    body{font-family:system-ui,-apple-system,sans-serif;background:#0b0d10;color:#f5f7fa;max-width:760px;margin:0 auto;padding:48px 22px;line-height:1.8}
    .card{background:#14181d;border:1px solid #262d35;border-radius:20px;padding:24px;margin:18px 0}
    code{direction:ltr;display:inline-block;background:#090b0e;padding:2px 8px;border-radius:8px;color:#9fe8b4}
    h1{font-size:28px;margin-bottom:6px}.muted{color:#9ca8b5}.ok{color:#9fe8b4}
  </style>
</head>
<body>
  <h1>بوت المتجر العربي</h1>
  <p class="muted">واجهة التشغيل فقط — لا يتم عرض أي أسرار هنا.</p>
  <div class="card"><strong class="ok">✓ المشروع يعمل</strong><br>Health: <code>/api/health</code></div>
  <div class="card">بعد إضافة متغيرات البيئة افتح:<br><code>/api/setup?secret=YOUR_SETUP_SECRET</code><br>مرة واحدة لربط Webhook وتسجيل أوامر البوت.</div>
  <div class="card">لفحص شكل منتجات المورد قبل تفعيل الشراء:<br><code>/api/debug-products?secret=YOUR_SETUP_SECRET</code></div>
</body>
</html>
