<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0f" />
  <title>كل شي — المتجر</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{--bg:var(--tg-theme-bg-color,#0b0b0f);--panel:var(--tg-theme-secondary-bg-color,#181820);--card:#24232c;--text:var(--tg-theme-text-color,#fff);--muted:var(--tg-theme-hint-color,#9a99a4);--accent:var(--tg-theme-button-color,#7d5cff);--accentText:var(--tg-theme-button-text-color,#fff);--line:rgba(255,255,255,.07);--safe:env(safe-area-inset-bottom,0px)}
    *{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Tahoma,sans-serif}body{min-height:100vh;padding-bottom:calc(88px + var(--safe))}
    button,input{font:inherit}.shell{max-width:760px;margin:0 auto;padding:18px 14px 28px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.brand h1{font-size:26px;margin:0 0 3px;font-weight:850}.brand p{margin:0;color:var(--muted);font-size:14px}.badge{padding:7px 10px;border-radius:999px;background:rgba(95,211,147,.12);color:#74e2a8;font-size:12px;font-weight:800;border:1px solid rgba(116,226,168,.18)}
    .search{position:relative;margin:14px 0 16px}.search input{width:100%;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:13px 42px 13px 14px;outline:none}.search span{position:absolute;right:14px;top:12px;opacity:.7}
    .section-title{font-size:14px;color:var(--muted);margin:18px 2px 10px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.category{min-height:72px;border:1px solid var(--line);background:var(--card);border-radius:16px;color:var(--text);padding:10px 8px;display:flex;align-items:center;justify-content:flex-start;gap:8px;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.14);overflow:hidden}.category:active{transform:scale(.98)}.icon{width:35px;height:35px;border-radius:10px;background:#fff;display:grid;place-items:center;flex:0 0 35px;overflow:hidden;position:relative}.icon img{width:25px;height:25px;object-fit:contain;position:relative;z-index:2}.icon .fallback{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;z-index:1}.category strong{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:left}.category small{display:none}
    .hero{background:linear-gradient(135deg,rgba(125,92,255,.22),rgba(30,208,183,.08));border:1px solid rgba(125,92,255,.24);border-radius:20px;padding:16px;margin-bottom:14px}.hero b{display:block;font-size:17px;margin-bottom:6px}.hero span{color:var(--muted);font-size:13px;line-height:1.7}
    .products{display:grid;gap:10px}.product{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px}.product-head{display:flex;gap:10px;align-items:flex-start}.product-title{font-size:15px;font-weight:800;line-height:1.5;flex:1}.stock{font-size:11px;padding:5px 8px;border-radius:999px;background:rgba(116,226,168,.1);color:#74e2a8;white-space:nowrap}.stock.out{background:rgba(255,96,96,.1);color:#ff8a8a}.copy{font-size:13px;color:var(--muted);line-height:1.7;margin:8px 0 12px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.price{font-size:16px;font-weight:900}.buy{border:0;border-radius:12px;background:var(--accent);color:var(--accentText);padding:10px 14px;font-weight:850;cursor:pointer}.buy[disabled]{opacity:.42;cursor:not-allowed}.back{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:9px 12px;border-radius:12px;cursor:pointer;margin-bottom:12px}
    .empty{padding:36px 18px;text-align:center;color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;line-height:1.9}.panel h2{margin:0 0 8px;font-size:20px}.panel p{color:var(--muted);margin:0}.panel .cta{margin-top:14px;border:0;background:var(--accent);color:var(--accentText);border-radius:14px;padding:11px 16px;font-weight:850;cursor:pointer}
    .nav{position:fixed;z-index:20;left:0;right:0;bottom:0;padding:9px 10px calc(9px + var(--safe));background:rgba(14,14,18,.92);backdrop-filter:blur(18px);border-top:1px solid var(--line)}.nav-inner{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.nav button{border:0;background:transparent;color:var(--muted);padding:7px 3px;border-radius:12px;font-size:10px;cursor:pointer}.nav button span{display:block;font-size:21px;margin-bottom:2px}.nav button.active{background:rgba(125,92,255,.15);color:var(--text)}
    .loader{display:grid;place-items:center;padding:60px 0;color:var(--muted)}
    @media(max-width:390px){.grid{gap:6px}.category{padding:8px 6px;gap:6px}.category strong{font-size:13px}.icon{width:31px;height:31px;flex-basis:31px}.icon img{width:22px;height:22px}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="top"><div class="brand"><h1 id="storeTitle">كل شي</h1><p>اختار اللي تبيه وخله علينا ✨</p></div><div class="badge" id="statusBadge">متصل</div></div>
    <div id="view"><div class="loader">جاري تحميل المنتجات…</div></div>
  </main>
  <nav class="nav"><div class="nav-inner">
    <button data-tab="products" class="active"><span>🛍️</span>المنتجات</button>
    <button data-tab="support"><span>💬</span>الدعم</button>
    <button data-tab="wallet"><span>👛</span>المحفظة</button>
    <button data-tab="api"><span>🔗</span>API</button>
    <button data-tab="warranty"><span>🛡️</span>الضمان</button>
  </div></nav>
<script>
const tg = window.Telegram?.WebApp; if(tg){tg.ready();tg.expand();tg.setHeaderColor?.('#0b0b0f');tg.setBackgroundColor?.('#0b0b0f')}
const BOT='Everythinnngbot';
const defs=[
['ChatGPT',/chatgpt|openai|codex/i,'openai','🤖'],['Google',/google one|gemini|google pay/i,'google','🌈'],['CapCut',/capcut/i,'capcut','🎬'],['Gmail',/gmail|googlemail/i,'gmail','📧'],['Canva',/canva/i,'canva','🎨'],['Claude',/claude|anthropic/i,'anthropic','🟠'],['Meitu',/meitu/i,'meitu','🩷'],['NordVPN',/nord\s?vpn/i,'nordvpn','🛡️'],['Telegram',/telegram|tele\b/i,'telegram','✈️'],['HMA VPN',/hma|hide my ass/i,'protonvpn','🦸'],['Notion',/notion/i,'notion','📝'],['AutoDesk',/autodesk|autocad/i,'autodesk','📐'],['SCRIBD',/scribd/i,'scribd','📚'],['Cursor',/cursor/i,'cursor','⬛'],['Kling',/kling/i,'klingai','🎞️'],['YouTube',/youtube/i,'youtube','▶️'],['Zoom',/zoom/i,'zoom','📹'],['Outlook',/outlook|hotmail/i,'microsoftoutlook','📨'],['TikTok',/tiktok/i,'tiktok','🎵'],['Figma',/figma/i,'figma','🧩'],['Duolingo',/duolingo/i,'duolingo','🦉'],['Krea',/krea/i,'krea','🖼️'],['Wink',/wink/i,'wink','✨'],['Adobe',/adobe/i,'adobe','🅰️'],['Trading',/trading/i,'tradingview','📈'],['Microsoft',/microsoft|office|365/i,'microsoft','🪟'],['Lovable',/lovable/i,'lovable','💜'],['Seedance',/seedance/i,'bytedance','🎥'],['Quizlet',/quizlet/i,'quizlet','🧠'],['Spotify',/spotify/i,'spotify','🎧'],['VPN',/vpn|proxy/i,'wireguard','🔐'],['AI Tools',/gpt|ai\b|midjourney|runway/i,'openai','✨']
];
let data={products:[],livePurchases:false,storeTitle:'كل شي'};
function iconUrl(slug){return `https://cdn.simpleicons.org/${slug}/111111`}
function categoryFor(name){return defs.find(d=>d[1].test(name))||['أخرى',/.*/,'googlegemini','🛒']}
function groups(){const m=new Map();for(const p of data.products){const d=categoryFor(p.name);const k=d[0];if(!m.has(k))m.set(k,{def:d,items:[]});m.get(k).items.push(p)}return [...m.values()].sort((a,b)=>{const ai=defs.findIndex(d=>d[0]===a.def[0]),bi=defs.findIndex(d=>d[0]===b.def[0]);return (ai<0?999:ai)-(bi<0?999:bi)})}
function shortName(v,max=54){const t=String(v||'').replace(/https?:\/\/\S+/g,'').replace(/\s+/g,' ').trim();return t.length>max?t.slice(0,max).trim()+'…':t}
function salesLine(name){const s=name.toLowerCase();if(/chatgpt|openai|codex/.test(s))return 'جاهز للي يبي يبدأ بسرعة وبدون تعقيد.';if(/gmail|hotmail|outlook/.test(s))return 'خدمة جاهزة وتسليمها سريع بإذن الله.';if(/vpn/.test(s))return 'خصوصية واتصال سريع، جاهز للاستخدام.';if(/canva|adobe|figma/.test(s))return 'مناسب للشغل والتصميم، وتفعيله سريع.';if(/youtube|spotify|capcut|tiktok/.test(s))return 'مناسب للترفيه والمحتوى، وخدمته سريعة.';return 'خدمة جاهزة وسريعة، اطلبها والباقي علينا.'}
function openBot(path=''){const url=`https://t.me/${BOT}${path}`;if(tg?.openTelegramLink)tg.openTelegramLink(url);else location.href=url}
function setTab(tab){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='products')renderCategories();else renderInfo(tab)}
function renderCategories(filter=''){const list=groups().filter(g=>g.def[0].toLowerCase().includes(filter.toLowerCase())||g.items.some(p=>p.name.toLowerCase().includes(filter.toLowerCase())));document.getElementById('view').innerHTML=`<div class="hero"><b>وش تبي اليوم؟ 👋</b><span>اختر القسم، وبعدها بتطلع لك الخدمات المتوفرة وأسعارها بالنجوم.</span></div><div class="search"><span>🔎</span><input id="search" placeholder="دور على خدمة…" value="${filter.replace(/"/g,'&quot;')}"></div><div class="section-title">الأقسام المتوفرة</div><div class="grid">${list.map(g=>`<button class="category" data-cat="${g.def[0]}"><div class="icon"><span class="fallback">${g.def[3]}</span><img src="${iconUrl(g.def[2])}" alt="" onerror="this.style.display='none'"></div><strong>${g.def[0]}</strong></button>`).join('')}</div>${list.length?'':'<div class="empty">ما لقينا شي بهالاسم.</div>'}`;document.getElementById('search').addEventListener('input',e=>renderCategories(e.target.value));document.querySelectorAll('.category').forEach(b=>b.onclick=()=>renderProducts(b.dataset.cat))}
function renderProducts(cat){const g=groups().find(x=>x.def[0]===cat);if(!g)return renderCategories();document.getElementById('view').innerHTML=`<button class="back" id="back">← رجوع للأقسام</button><div class="hero"><b>${cat}</b><span>هذي الخدمات المتوفرة حالياً. اختر اللي يناسبك.</span></div><div class="products">${g.items.map(p=>{const stock=p.available==null?'متوفر':p.available>0?`متاح ${p.available}`:'نفد';const out=p.available===0;const disabled=out||!p.autoPurchase||!p.stars;return `<article class="product"><div class="product-head"><div class="product-title">${shortName(p.name)}</div><span class="stock ${out?'out':''}">${stock}</span></div><div class="copy">${salesLine(p.name)}${!p.autoPurchase?' يحتاج بيانات إضافية قبل التنفيذ.':''}</div><div class="row"><div class="price">${p.stars?`⭐ ${p.stars} نجمة`:'السعر غير متاح'}</div><button class="buy" data-key="${p.key}" ${disabled?'disabled':''}>${out?'غير متوفر':!p.autoPurchase?'يحتاج بيانات':'شراء الآن'}</button></div></article>`}).join('')}</div>`;document.getElementById('back').onclick=()=>renderCategories();document.querySelectorAll('.buy:not([disabled])').forEach(b=>b.onclick=()=>openBot(`?start=buy_${b.dataset.key}`))}
function renderInfo(tab){const map={support:['💬 الدعم','واجهتك مشكلة؟ كلّمنا من البوت وبنساعدك.','فتح المحادثة'],wallet:['👛 المحفظة','الدفع داخل المتجر يتم عن طريق Telegram Stars. رصيدك وإدارته يكونون من تيليجرام.','فتح تيليجرام'],api:['🔗 API','عندنا خدمات API حسب المتوفر بالمخزون. ادخل المنتجات وشوف الخيارات الحالية.','عرض المنتجات'],warranty:['🛡️ الضمان','الضمان يختلف من خدمة لخدمة. قبل الشراء نوضح لك حالة المنتج والمخزون، وأي شرط خاص يظهر لك قبل الدفع.','رجوع للمنتجات']};const x=map[tab];document.getElementById('view').innerHTML=`<div class="panel"><h2>${x[0]}</h2><p>${x[1]}</p><button class="cta" id="infoCta">${x[2]}</button></div>`;document.getElementById('infoCta').onclick=()=>tab==='support'||tab==='wallet'?openBot():setTab('products')}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
fetch('/api/catalog',{cache:'no-store'}).then(r=>r.json()).then(j=>{if(!j.ok)throw new Error();data=j;document.getElementById('storeTitle').textContent=j.storeTitle||'كل شي';document.getElementById('statusBadge').textContent=j.livePurchases?'الشراء شغال':'تصفح فقط';renderCategories()}).catch(()=>{document.getElementById('view').innerHTML='<div class="empty">تعذر تحميل المنتجات حالياً. جرّب بعد شوي.</div>';document.getElementById('statusBadge').textContent='غير متصل'})
</script>
</body>
</html>
