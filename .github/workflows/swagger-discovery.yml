name: Swagger Discovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/swagger-discovery.yml'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Discover Canboso OpenAPI document
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://canboso.com'
          curl -fsSL "$BASE/api/swagger/" -o swagger.html
          echo '--- Swagger HTML references ---'
          grep -Eio '[A-Za-z0-9_./-]+\.(json|js)' swagger.html | sort -u | head -100 || true
          grep -Eio '.{0,80}(swagger|openapi|spec|url).{0,160}' swagger.html | head -100 || true

          candidates=(
            '/api/swagger-json'
            '/api/swagger/swagger.json'
            '/api/swagger/openapi.json'
            '/api/swagger/spec.json'
            '/api-json'
            '/swagger-json'
            '/openapi.json'
            '/swagger.json'
          )

          found=''
          for path in "${candidates[@]}"; do
            code=$(curl -sS -L -o candidate.json -w '%{http_code}' "$BASE$path" || true)
            bytes=$(wc -c < candidate.json 2>/dev/null || echo 0)
            echo "$path -> HTTP $code bytes=$bytes"
            if [ "$code" = '200' ] && jq -e '(.openapi // .swagger) != null' candidate.json >/dev/null 2>&1; then
              found="$path"
              break
            fi
          done

          if [ -z "$found" ]; then
            echo 'No OpenAPI JSON found via common paths.'
            exit 1
          fi

          echo "FOUND_OPENAPI=$found"
          jq -r '.openapi // .swagger' candidate.json
          echo '--- telegram-buyer paths ---'
          jq -c '.paths | to_entries[] | select(.key | contains("telegram-buyer"))' candidate.json
