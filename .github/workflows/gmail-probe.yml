name: Gmail Probe

on:
  push:
    branches: [main]
    paths:
      - 'api/search-gmail.js'
      - '.github/workflows/gmail-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Read Gmail products from production
        shell: bash
        run: |
          set -euo pipefail
          URL='https://evert-ingredients.vercel.app/api/search-gmail'
          for i in $(seq 1 18); do
            code=$(curl -sS --max-time 30 -o result.json -w '%{http_code}' "$URL" || true)
            echo "HTTP $code"
            cat result.json 2>/dev/null || true
            echo
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          exit 1
