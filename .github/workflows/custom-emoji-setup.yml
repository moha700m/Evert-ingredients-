name: Custom Emoji Setup

on:
  push:
    branches: [main]
    paths:
      - 'api/custom-emoji-setup.js'
      - '.github/workflows/custom-emoji-setup.yml'
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Probe brand custom emoji setup
        shell: bash
        run: |
          set -euo pipefail
          # Retry against the already-deployed icon proxy.
          URL='https://evert-ingredients.vercel.app/api/custom-emoji-setup?nonce=rGCKXI3vooPSpPA9z9V_IpDFrmUY3poE'
          code=$(curl -sS --max-time 60 -o result.json -w '%{http_code}' "$URL" || true)
          echo "HTTP $code"
          cat result.json 2>/dev/null || true
          echo
          test "$code" = "200"
