name: Custom Emoji Setup

on:
  push:
    branches: [main]
    paths:
      - 'api/custom-emoji-setup.js'
      - '.github/workflows/custom-emoji-setup.yml'
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Create brand custom emoji pack
        shell: bash
        run: |
          set -euo pipefail
          URL='https://evert-ingredients.vercel.app/api/custom-emoji-setup?nonce=rGCKXI3vooPSpPA9z9V_IpDFrmUY3poE'
          for i in $(seq 1 40); do
            code=$(curl -sS --max-time 60 -o result.json -w '%{http_code}' "$URL" || true)
            echo "HTTP $code"
            cat result.json 2>/dev/null || true
            echo
            if [ "$code" = "200" ] && [ "$(jq -r '.complete // false' result.json 2>/dev/null || echo false)" = "true" ]; then
              exit 0
            fi
            sleep 8
          done
          exit 1
