name: Add Other Category Icon

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-other-icon.yml'
  workflow_dispatch:

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Create neutral custom emoji
        shell: bash
        run: |
          set -euo pipefail
          URL='https://evert-ingredients.vercel.app/api/add-other-icon?nonce=bIDtvgW5tkwgoIXDNRw63MlVdVksKX_OyP48WZo2bMs'
          for i in $(seq 1 12); do
            code=$(curl -sS --max-time 60 -o result.json -w '%{http_code}' "$URL" || true)
            echo "HTTP $code"
            cat result.json 2>/dev/null || true
            echo
            if [ "$code" = "200" ] && [ "$(jq -r '.ok // false' result.json 2>/dev/null || echo false)" = "true" ]; then
              exit 0
            fi
            sleep 8
          done
          exit 1
