name: Production Diagnostics

on:
  push:
    branches: [main]
    paths:
      - 'api/diagnostics.js'
      - 'api/**'
      - '.github/workflows/production-diagnostics.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel production deployment and test diagnostics
        shell: bash
        run: |
          set -euo pipefail
          URL='https://evert-ingredients.vercel.app/api/diagnostics'
          for i in $(seq 1 18); do
            echo "Attempt $i: $URL"
            HTTP_CODE=$(curl -sS --max-time 30 -o response.json -w '%{http_code}' "$URL" || true)
            cat response.json 2>/dev/null || true
            echo
            echo "HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              node -e "const f=require('fs');const j=JSON.parse(f.readFileSync('response.json','utf8')); if(!j.ok) process.exit(1); console.log('Diagnostics OK:', JSON.stringify(j,null,2));"
              exit 0
            fi
            sleep 10
          done
          echo 'Production diagnostics did not become healthy in time.' >&2
          exit 1
