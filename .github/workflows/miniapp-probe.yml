name: Mini App Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/miniapp-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check storefront and catalog
        shell: bash
        run: |
          set -euo pipefail
          ROOT='https://evert-ingredients.vercel.app/'
          CATALOG='https://evert-ingredients.vercel.app/api/catalog'
          for i in $(seq 1 18); do
            root_code=$(curl -sS --max-time 30 -o root.html -w '%{http_code}' "$ROOT" || true)
            catalog_code=$(curl -sS --max-time 30 -o catalog.json -w '%{http_code}' "$CATALOG" || true)
            echo "ROOT=$root_code CATALOG=$catalog_code"
            head -c 220 root.html 2>/dev/null || true
            echo
            head -c 500 catalog.json 2>/dev/null || true
            echo
            if [ "$root_code" = "200" ] && [ "$catalog_code" = "200" ]; then
              grep -q 'وش تبي اليوم' root.html
              grep -q '"ok":true' catalog.json
              exit 0
            fi
            sleep 10
          done
          exit 1
